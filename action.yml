name: "Git Cut Tag"
description: "Language-agnostic semantic-version tagging driven by the latest git tag and a version-line file, with optional dev (timestamped pre-release) tags"
author: "Ybor / P6M <engineering@ybor.ai>"

# Define the inputs for this action
inputs:
  version-file:
    description: "Path to the version-line file. Holds '<prefix><major>.<minor>' (e.g. 'v1.2'). The prefix is inferred from its contents unless 'prefix' is set. The file is read-only; the maintainer owns it."
    required: false
    default: ".version"
  version-level:
    description: "Version level to bump relative to the latest tag: patch, minor, or major"
    required: false
    default: "patch"
  prefix:
    description: "Override the tag prefix (e.g. 'v'). When empty, the prefix is inferred from the version file's leading non-digit characters."
    required: false
    default: ""
  dev:
    description: "Build a development pre-release tag with a trailing epoch timestamp (e.g. 'v1.2.5-1782043845')."
    required: false
    default: "false"
  working-directory:
    description: "Directory to operate in (must contain the version file and be inside the git repo)"
    required: false
    default: "."
  skip-push:
    description: "Skip pushing the tag to the remote (useful for testing)"
    required: false
    default: "false"

# Define the outputs for this action
outputs:
  version:
    description: "The new version, without prefix (e.g. '1.2.5' or '1.2.5-1782043845')"
    value: ${{ steps.cut.outputs.version }}
  tag:
    description: "The created git tag, with prefix (e.g. 'v1.2.5')"
    value: ${{ steps.cut.outputs.tag }}
  base-version:
    description: "The release version without any dev suffix (e.g. '1.2.5')"
    value: ${{ steps.cut.outputs.base-version }}
  is-dev:
    description: "'true' when a development (pre-release) tag was created"
    value: ${{ steps.cut.outputs.is-dev }}

# Define the runs configuration
runs:
  using: "composite"
  steps:
    - name: Token Exchange
      uses: p6m-actions/token-exchange@v2

    - name: Compute version and cut tag
      id: cut
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_VERSION_FILE: ${{ inputs.version-file }}
        INPUT_VERSION_LEVEL: ${{ inputs.version-level }}
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_DEV: ${{ inputs.dev }}
        INPUT_SKIP_PUSH: ${{ inputs.skip-push }}
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/cut-tag.sh"

# Define the branding for the action in the GitHub Marketplace
branding:
  icon: "tag"
  color: "green"
